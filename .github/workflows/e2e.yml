name: E2E

# Vercel reports each web deployment here, including a branch pushed before its PR opens. Its
# environment is "Preview – <name>-web". The API project's GitHub deployments are off: its
# events would add a skipped e2e run on the same commit, which can hide this one's result.
on: deployment_status

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview') &&
      endsWith(github.event.deployment.environment, '-web')
    # Vercel's deployment ref is the commit SHA: a redeploy of the same commit supersedes this run.
    concurrency:
      group: e2e-${{ github.event.deployment.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ github.event.deployment_status.environment_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # The web preview reaches its paired API preview through /api; both build from each push, so
      # wait until that API reports this commit. A newer push to the branch replaces the API preview,
      # so once this commit is no longer a branch head, stop: the new head gets its own run.
      - name: Wait for the paired API preview
        id: api
        env:
          SHA: ${{ github.event.deployment.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 180); do
            sha=$(curl -sf -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$BASE_URL/api/health" | jq -r .sha) || sha=
            [ "$sha" = "$SHA" ] && exit 0
            heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/branches-where-head" --jq length) || heads=
            if [ "$heads" = 0 ]; then
              echo "::notice::$SHA was superseded by a newer push; the new head gets its own run."
              echo "superseded=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "The paired API never reported $SHA (last answer: '${sha}')." >&2
          exit 1
      - if: steps.api.outputs.superseded != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - if: steps.api.outputs.superseded != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - if: steps.api.outputs.superseded != 'true'
        run: bun install --frozen-lockfile && bunx playwright install --with-deps --only-shell chromium
      - if: steps.api.outputs.superseded != 'true'
        run: bunx playwright test tests/e2e/sign-in.spec.ts
        env:
          CI: true
          TEST_OTP_CODE: ${{ secrets.TEST_OTP_CODE }}
