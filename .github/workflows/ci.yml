name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # An alarm only: Vercel has already deployed main by the time this runs.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !github.event.pull_request.draft }}
    concurrency:
      group: verify-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check
      - run: bunx oxlint --type-aware
      - run: bunx knip
      - run: bun run typecheck
      - run: bun run --filter @app/api test
